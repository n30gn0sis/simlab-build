# Catch-all for :443, installed and enabled by scripts/r770-portal.sh apply.
# A TLS client whose SNI names none of the enabled .lab vhosts -- a bare IP,
# an unknown name, no SNI at all -- has its handshake rejected here instead of
# being served whichever vhost nginx happened to load first. No certificate is
# needed for that (ssl_reject_handshake, nginx >= 1.19.4; Ubuntu 24.04 ships
# 1.24). The .lab vhosts listen on IPv4 only, so on IPv6 this is the only
# :443 server and every handshake there is rejected.
#
# Port 80 is deliberately NOT claimed: Ubuntu's own "default" site keeps
# default_server there, and each .lab vhost carries its own :80 redirect.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
}
