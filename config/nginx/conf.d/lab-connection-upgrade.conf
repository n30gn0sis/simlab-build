# http-level (conf.d/*.conf is included inside http {} by Ubuntu's nginx.conf).
# The one definition of $connection_upgrade -- define it nowhere else, or
# nginx -t fails on the duplicate. Proxied vhosts send
#   proxy_set_header Connection $connection_upgrade;
# so a websocket upgrade is passed through and every other request is not
# forced into an "upgrade" connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
