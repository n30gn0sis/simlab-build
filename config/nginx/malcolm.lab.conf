# Portal vhost: malcolm.lab -> Malcolm's own nginx-proxy on 127.0.0.1:8443.
# The certificate is the lab one issued by scripts/r770-lab-ca.sh (via
# snippets/lab-tls.conf).
#
# Malcolm's compose publishes nginx-proxy on 0.0.0.0:443 and its installer has
# no setting for that bind; `scripts/r770-malcolm-deploy.sh bind-loopback`
# moves it to 127.0.0.1:8443 after every installer run (a
# docker-compose.override.yml does NOT work: scripts/control.py passes -f
# explicitly, which disables override auto-loading -- measured 2026-09-12).
server {
    listen 443 ssl http2;        # 'http2 on;' needs nginx >= 1.25.1; the bundle ships 24.04's 1.24.0
    server_name malcolm.lab;

    include snippets/lab-tls.conf;
    include snippets/lab-headers.conf;   # server level: no add_header below

    client_max_body_size 0;      # PCAP uploads are large
    proxy_read_timeout 300s;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;                 # Malcolm's internal cert is self-signed

        # lab-headers.conf sets these; drop Malcolm's own copies so the
        # browser sees exactly one of each, not two that may disagree.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        # Malcolm's redirects were measured relative (Location: sessions,
        # /dashboards/app/home, admin_login.php) so these are belt-and-braces
        # for anything that later builds an absolute URL (Keycloak mode).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # Arkime and OpenSearch Dashboards are SPAs using websockets.
        # $connection_upgrade: conf.d/lab-connection-upgrade.conf.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
