# Security headers for the .lab vhosts. Include at SERVER level only: an
# add_header anywhere inside a location drops every server-level add_header
# for that location (nginx inheritance), so the vhosts that include this carry
# no add_header of their own.
#
# HSTS is one day, no includeSubDomains, no preload: easy to back out of on an
# internal CA. SAMEORIGIN still lets Malcolm, Arkime and Dashboards frame their
# own pages. 'always' keeps the headers on 401s and errors too.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "SAMEORIGIN" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
