# charon logs to syslog by default and the image has no syslog; write /gt/charon.log.
# Levels (--debug) are tuned in the probe.
charon {
  filelog {
    charon {
      path = /gt/charon.log
      time_format = %b %e %T
      ike_name = yes
      append = yes
      default = 1
      flush_line = yes
    }
  }
}
