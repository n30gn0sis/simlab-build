# images/ipsec-ss/strongswan.d/save-keys.conf — option names verified against the 5.9.13
# source's conf/plugins/save-keys.opt by probe O3 (state/inventory/ipsec-probes-2026-10-08.md);
# the plugin writes esp_sa, ikev2_decryption_table and ikev1_decryption_table into wireshark_keys.
#
# Installed as /etc/strongswan.d/charon/save-keys.conf, which the distro's strongswan.conf
# includes *inside* `charon { plugins { } }` — so this file is the bare plugin block, not a
# `charon { plugins { ... } }` wrapper (wrapped, it lands at charon.plugins.charon.plugins.*
# and the plugin silently stays unloaded — found by the 2026-10-08 staging rehearsal).
save-keys {
  load = yes
  esp = yes
  ike = yes
  wireshark_keys = /gt/keys
}
