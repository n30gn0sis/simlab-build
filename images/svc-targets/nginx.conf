# Minimal static server for /srv/www (fixed.bin). Replaces the packaged nginx.conf.
user www-data;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    access_log /dev/stdout;
    server {
        listen 80;
        root /srv/www;
        location / { autoindex off; }
    }
}
