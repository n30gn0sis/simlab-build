! W1 isp1: one interface per access /30. No route to 10.200.0.0/16 on purpose
! (the ISP must never know the private sites; plaintext leakage stays detectable).
frr defaults traditional
hostname isp1
log stdout
!
interface eth0
 ip address 198.18.1.1/30
!
interface eth1
 ip address 198.18.2.1/30
!
line vty
!
